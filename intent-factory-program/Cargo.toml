[package]
name = "intent-factory-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
sha2 = "0.10"
solana-program = "2.3"
spl-token = { version = "8", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "7", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
spl-token = { version = "8", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "7", features = ["no-entrypoint"] }
